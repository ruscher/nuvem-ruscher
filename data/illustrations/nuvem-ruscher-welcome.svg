<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustração original do Nuvem Ruscher: nuvem com fotos em leque. CC-BY-SA 4.0 -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <radialGradient id="halo" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#62a0ea" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#3584e4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3584e4" stop-opacity="0"/>
