  <g>
    <path d="M86 196 h150 a38 38 0 0 0 4 -75.8 a50 50 0 0 0 -94 -20 a36 36 0 0 0 -58 26 a35 35 0 0 0 -2 69.8z" fill="#1c3f73" opacity="0.10" transform="translate(0 6)"/>
    <path d="M86 196 h150 a38 38 0 0 0 4 -75.8 a50 50 0 0 0 -94 -20 a36 36 0 0 0 -58 26 a35 35 0 0 0 -2 69.8z" fill="#1c3f73" opacity="0.08" transform="translate(0 3)"/>
    <path d="M86 196 h150 a38 38 0 0 0 4 -75.8 a50 50 0 0 0 -94 -20 a36 36 0 0 0 -58 26 a35 35 0 0 0 -2 69.8z"
